<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 620" width="1050" height="620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1050" height="620" fill="#f8fafc"/>
  <text x="525" y="34" font-size="19" font-weight="bold" text-anchor="middle" fill="#0f172a">SIGRES · Vista de Componentes e Interfaces (A5)</text>

  <!-- UI Web -->
  <g transform="translate(40,220)">
    <rect width="200" height="140" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="100" y="30" font-size="11" text-anchor="middle" fill="#1e40af">&lt;&lt;component&gt;&gt;</text>
    <text x="100" y="52" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">UI Web SPA &amp; KDS</text>
    <text x="100" y="80" font-size="11" text-anchor="middle" fill="#334155">Salón, Cocina, Caja, QR</text>
    <text x="100" y="115" font-size="10" text-anchor="middle" fill="#1e40af">Requiere: IAuth, IPedidos,</text>
    <text x="100" y="129" font-size="10" text-anchor="middle" fill="#1e40af">ICocina, IFacturacion, ICatalogo</text>
  </g>

  <!-- Services Middle Column -->
  <g transform="translate(360,55)">
    <rect width="240" height="82" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="120" y="22" font-size="10" text-anchor="middle" fill="#166534">&lt;&lt;component&gt;&gt; Provee: IAutorizacion</text>
    <text x="120" y="44" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">Servicio Auth &amp; RBAC</text>
    <text x="120" y="66" font-size="10" text-anchor="middle" fill="#166534">JWT, Hash+Sal, 4 roles</text>
  </g>

  <g transform="translate(360,165)">
    <rect width="240" height="82" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="120" y="22" font-size="10" text-anchor="middle" fill="#166534">&lt;&lt;component&gt;&gt; Provee: IPedidos</text>
    <text x="120" y="44" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">Servicio Pedidos &amp; Mesas</text>
    <text x="120" y="66" font-size="10" text-anchor="middle" fill="#166534">FachadaPedidoCocina, Detalles</text>
  </g>

  <g transform="translate(360,275)">
    <rect width="240" height="82" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="120" y="22" font-size="10" text-anchor="middle" fill="#92400e">&lt;&lt;component&gt;&gt; Provee: ICocina</text>
    <text x="120" y="44" font-size="13" font-weight="bold" text-anchor="middle" fill="#78350f">Servicio Cocina (KDS)</text>
    <text x="120" y="66" font-size="10" text-anchor="middle" fill="#92400e">WebSockets Tiempo Real</text>
  </g>

  <g transform="translate(360,385)">
    <rect width="240" height="82" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="120" y="22" font-size="10" text-anchor="middle" fill="#5b21b6">&lt;&lt;component&gt;&gt; Provee: IFacturacion</text>
    <text x="120" y="44" font-size="13" font-weight="bold" text-anchor="middle" fill="#4c1d95">Servicio Facturación &amp; Caja</text>
    <text x="120" y="66" font-size="10" text-anchor="middle" fill="#5b21b6">EstrategiaPago (Mixto / Dividido)</text>
  </g>

  <g transform="translate(360,495)">
    <rect width="240" height="82" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="120" y="22" font-size="10" text-anchor="middle" fill="#166534">&lt;&lt;component&gt;&gt; Provee: IInventario, ICatalogo</text>
    <text x="120" y="44" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">Servicio Inventario &amp; Menú</text>
    <text x="120" y="66" font-size="10" text-anchor="middle" fill="#166534">RecetaInsumo, Alertas Stock</text>
  </g>

  <!-- DB Component -->
  <g transform="translate(760,235)">
    <rect width="240" height="140" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="120" y="30" font-size="11" text-anchor="middle" fill="#991b1b">&lt;&lt;database&gt;&gt; Provee: IDatos</text>
    <text x="120" y="55" font-size="14" font-weight="bold" text-anchor="middle" fill="#7f1d1d">PostgreSQL SIGRES</text>
    <text x="120" y="82" font-size="11" text-anchor="middle" fill="#334155">13 Tablas Normalizadas 3FN</text>
    <text x="120" y="102" font-size="11" text-anchor="middle" fill="#334155">Transacciones ACID</text>
  </g>

  <!-- Connectors UI -> Services -->
  <path d="M 240 255 L 360 96" fill="none" stroke="#334155" stroke-width="1.5"/>
  <path d="M 240 270 L 360 206" fill="none" stroke="#334155" stroke-width="1.5"/>
  <path d="M 240 290 L 360 316" fill="none" stroke="#d97706" stroke-width="1.8"/>
  <path d="M 240 310 L 360 426" fill="none" stroke="#334155" stroke-width="1.5"/>
  <path d="M 240 330 L 360 536" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Connectors Services -> DB -->
  <path d="M 600 96 L 760 270" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M 600 206 L 760 285" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M 600 316 L 760 305" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M 600 426 L 760 325" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M 600 536 L 760 345" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>
