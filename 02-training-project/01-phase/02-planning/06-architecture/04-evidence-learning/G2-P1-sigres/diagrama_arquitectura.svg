<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="620" fill="#f8fafc"/>
  <text x="480" y="34" font-size="19" font-weight="bold" text-anchor="middle" fill="#0f172a">SIGRES · Arquitectura en 3 Capas Estrictas (A4)</text>

  <!-- Layer 1: Presentacion -->
  <rect x="40" y="55" width="880" height="130" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="80" font-size="14" font-weight="bold" fill="#1e40af">1. Capa de Presentación (Cliente Web SPA / KDS / QR)</text>
  <rect x="75" y="100" width="230" height="60" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="190" y="135" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Panel Mesero y Menú QR</text>
  <rect x="365" y="100" width="230" height="60" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="135" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Pantalla KDS Cocina</text>
  <rect x="655" y="100" width="230" height="60" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="770" y="135" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Módulo Caja y Admin</text>

  <!-- Arrows 1 -> 2 -->
  <line x1="190" y1="185" x2="190" y2="235" stroke="#0f172a" stroke-width="2"/>
  <polygon points="190,235 184,224 196,224" fill="#0f172a"/>
  <text x="200" y="216" font-size="11" fill="#334155">HTTPS REST/JSON</text>

  <line x1="480" y1="185" x2="480" y2="235" stroke="#d97706" stroke-width="2"/>
  <polygon points="480,235 474,224 486,224" fill="#d97706"/>
  <text x="490" y="216" font-size="11" fill="#92400e">WSS Tiempo Real (≤ 5 s)</text>

  <line x1="770" y1="185" x2="770" y2="235" stroke="#0f172a" stroke-width="2"/>
  <polygon points="770,235 764,224 776,224" fill="#0f172a"/>
  <text x="780" y="216" font-size="11" fill="#334155">HTTPS REST/JSON</text>

  <!-- Layer 2: Negocio -->
  <rect x="40" y="235" width="880" height="145" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="260" font-size="14" font-weight="bold" fill="#166534">2. Capa de Lógica de Negocio (Backend API NestJS / TypeScript)</text>
  <rect x="75" y="280" width="230" height="75" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="190" y="312" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">Middleware Auth &amp; RBAC</text>
  <text x="190" y="332" font-size="11" text-anchor="middle" fill="#166534">JWT + Verificación 4 roles</text>
  <rect x="365" y="280" width="230" height="75" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="480" y="312" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">FachadaPedidoCocina</text>
  <text x="480" y="332" font-size="11" text-anchor="middle" fill="#166534">Pedidos, Mesas, KDS, Stock</text>
  <rect x="655" y="280" width="230" height="75" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="770" y="312" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">Motor EstrategiaPago</text>
  <text x="770" y="332" font-size="11" text-anchor="middle" fill="#166534">Facturación, Pagos Mixtos, Reportes</text>

  <!-- Arrows 2 -> 3 -->
  <line x1="480" y1="380" x2="480" y2="430" stroke="#0f172a" stroke-width="2"/>
  <polygon points="480,430 474,419 486,419" fill="#0f172a"/>
  <text x="492" y="410" font-size="11" fill="#334155">Contratos de Repositorio + Transacciones ACID (TCP 5432)</text>

  <!-- Layer 3: Datos -->
  <rect x="40" y="430" width="880" height="130" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="60" y="455" font-size="14" font-weight="bold" fill="#92400e">3. Capa de Acceso a Datos y Persistencia</text>
  <rect x="130" y="475" width="300" height="62" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="280" y="505" font-size="13" font-weight="bold" text-anchor="middle" fill="#78350f">Repositorios / ORM</text>
  <text x="280" y="523" font-size="11" text-anchor="middle" fill="#92400e">Consultas parametrizadas e índices</text>
  <rect x="530" y="475" width="300" height="62" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="680" y="505" font-size="13" font-weight="bold" text-anchor="middle" fill="#78350f">Motor PostgreSQL (13 Tablas)</text>
  <text x="680" y="523" font-size="11" text-anchor="middle" fill="#92400e">Integridad referencial y respaldos diarios</text>

  <text x="480" y="592" font-size="12" text-anchor="middle" fill="#475569">Regla arquitectónica: la Capa 1 nunca accede directo a la Capa 3; toda petición pasa por Auth/RBAC y Lógica de Negocio.</text>
</svg>
