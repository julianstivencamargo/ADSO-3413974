    <text x="8" y="74" font-size="11" fill="#334155">unidad_medida: VARCHAR(20)</text>
    <text x="8" y="90" font-size="11" fill="#334155">stock_actual: DECIMAL(10,3)</text>
    <text x="8" y="106" font-size="11" fill="#334155">stock_minimo: DECIMAL(10,3)</text>
  </g>

