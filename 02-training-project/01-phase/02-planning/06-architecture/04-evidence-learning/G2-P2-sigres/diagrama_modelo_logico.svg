    <text x="8" y="74" font-size="11" fill="#334155">orden_visual: INTEGER</text>
  </g>

  <!-- receta_insumo -->
  <g transform="translate(880,455)">
    <rect width="210" height="95" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
    <rect width="210" height="24" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
