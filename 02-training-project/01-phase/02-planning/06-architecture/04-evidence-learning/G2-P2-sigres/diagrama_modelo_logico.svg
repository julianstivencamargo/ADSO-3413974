  <!-- Legend -->
  <rect x="65" y="685" width="1270" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="85" y="712" font-size="12" font-weight="bold" fill="#0f172a">Leyenda de Notación Pata de Gallo (Crow's Foot) y Estándar Relacional:</text>
  <text x="85" y="734" font-size="11" fill="#334155">• || (Uno obligatorio)  • o| (Cero o uno opcional)  • o&lt; (Cero o muchos)  • |&lt; (Uno o muchos obligatorio)  • Líneas discontinuas: FKs de rol operativo hacia usuario.</text>
  <text x="85" y="752" font-size="11" fill="#334155">• Estándar: tablas en singular, columnas en snake_case, PK id_&lt;tabla&gt;. Todas las 14 llaves foráneas trazadas con acción referencial en SQL.</text>
</svg>
