    <text x="8" y="42" font-size="11" fill="#0f172a">PK id_usuario: INTEGER</text>
    <text x="8" y="58" font-size="11" fill="#1d4ed8">FK id_rol: INTEGER</text>
    <text x="8" y="74" font-size="11" fill="#334155">nombre_usuario: VARCHAR(40) UQ</text>
    <text x="8" y="90" font-size="11" fill="#334155">hash_contrasena: VARCHAR(255)</text>
    <text x="8" y="106" font-size="11" fill="#334155">activo: BOOLEAN</text>
  </g>

  <!-- telefono_usuario -->
  <g transform="translate(65,195)">
    <rect width="190" height="90" rx="5" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect width="190" height="24" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
    <text x="95" y="16" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">telefono_usuario</text>
    <text x="8" y="42" font-size="11" fill="#0f172a">PK id_telefono: INTEGER</text>
    <text x="8" y="58" font-size="11" fill="#1d4ed8">FK id_usuario: INTEGER</text>
    <text x="8" y="74" font-size="11" fill="#334155">numero: VARCHAR(20)</text>
  </g>

  <!-- mesa -->
  <g transform="translate(600,65)">
    <rect width="190" height="105" rx="5" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect width="190" height="24" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
    <text x="95" y="16" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">mesa</text>
    <text x="8" y="42" font-size="11" fill="#0f172a">PK id_mesa: INTEGER</text>
    <text x="8" y="58" font-size="11" fill="#334155">numero: INTEGER UQ</text>
    <text x="8" y="74" font-size="11" fill="#334155">capacidad: INTEGER</text>
    <text x="8" y="90" font-size="11" fill="#334155">estado: VARCHAR(20)</text>
  </g>

  <!-- pedido -->
  <g transform="translate(315,255)">
    <rect width="230" height="135" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect width="230" height="24" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="115" y="16" font-size="12" font-weight="bold" text-anchor="middle" fill="#0369a1">pedido</text>
    <text x="8" y="42" font-size="11" fill="#0f172a">PK id_pedido: INTEGER</text>
    <text x="8" y="58" font-size="11" fill="#1d4ed8">FK id_mesa: INTEGER</text>
    <text x="8" y="74" font-size="11" fill="#1d4ed8">FK id_mesero: INTEGER</text>
    <text x="8" y="90" font-size="11" fill="#334155">fecha_hora: DATETIME</text>
    <text x="8" y="106" font-size="11" fill="#334155">estado: VARCHAR(25)</text>
    <text x="8" y="122" font-size="11" fill="#334155">observacion_general: VARCHAR(250)</text>
  </g>

  <!-- comanda_cocina -->
  <g transform="translate(65,360)">
    <rect width="205" height="120" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
    <rect width="205" height="24" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
    <text x="102" y="16" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">comanda_cocina</text>
    <text x="8" y="42" font-size="11" fill="#0f172a">PK id_comanda: INTEGER</text>
    <text x="8" y="58" font-size="11" fill="#1d4ed8">FK id_pedido: INTEGER UQ</text>
    <text x="8" y="74" font-size="11" fill="#1d4ed8">FK id_cocinero: INTEGER</text>
    <text x="8" y="90" font-size="11" fill="#334155">estado_cocina: VARCHAR(25)</text>
    <text x="8" y="106" font-size="11" fill="#334155">hora_envio / hora_listo</text>
  </g>

  <!-- detalle_pedido -->
  <g transform="translate(600,255)">
    <rect width="230" height="130" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
    <rect width="230" height="24" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="115" y="16" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">detalle_pedido (N:M)</text>
    <text x="8" y="42" font-size="11" fill="#0f172a">PK id_detalle_pedido: INTEGER</text>
    <text x="8" y="58" font-size="11" fill="#1d4ed8">FK id_pedido: INTEGER</text>
    <text x="8" y="74" font-size="11" fill="#1d4ed8">FK id_plato: INTEGER</text>
    <text x="8" y="90" font-size="11" fill="#334155">cantidad: INTEGER (&gt;0)</text>
    <text x="8" y="106" font-size="11" fill="#334155">precio_unitario: DECIMAL(10,2)</text>
    <text x="8" y="122" font-size="11" fill="#334155">observaciones: VARCHAR(200)</text>
  </g>

  <!-- plato -->
  <g transform="translate(880,255)">
    <rect width="210" height="125" rx="5" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect width="210" height="24" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
    <text x="105" y="16" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">plato</text>
    <text x="8" y="42" font-size="11" fill="#0f172a">PK id_plato: INTEGER</text>
    <text x="8" y="58" font-size="11" fill="#1d4ed8">FK id_categoria: INTEGER</text>
    <text x="8" y="74" font-size="11" fill="#334155">nombre: VARCHAR(100)</text>
    <text x="8" y="90" font-size="11" fill="#334155">precio: DECIMAL(10,2) (&gt;0)</text>
    <text x="8" y="106" font-size="11" fill="#334155">disponible: BOOLEAN</text>
  </g>

  <!-- categoria -->
