    <text x="8" y="42" font-size="11" fill="#0f172a">PK/FK id_plato: INTEGER</text>
    <text x="8" y="58" font-size="11" fill="#0f172a">PK/FK id_insumo: INTEGER</text>
    <text x="8" y="74" font-size="11" fill="#334155">cantidad_porcion: DECIMAL(10,3)</text>
  </g>

  <!-- insumo -->
  <g transform="translate(1135,445)">
    <rect width="200" height="115" rx="5" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect width="200" height="24" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
    <text x="100" y="16" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">insumo</text>
    <text x="8" y="42" font-size="11" fill="#0f172a">PK id_insumo: INTEGER</text>
