<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 800" width="1360" height="800" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1360" height="800" fill="#f8fafc"/>
  <text x="680" y="34" font-size="19" font-weight="bold" text-anchor="middle" fill="#0f172a">SIGRES · Modelo Lógico Relacional (13 Tablas en 3FN · Notación Pata de Gallo)</text>

  <!-- rol -->
  <g transform="translate(65,65)">
    <rect width="190" height="90" rx="5" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect width="190" height="24" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
    <text x="95" y="16" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">rol</text>
    <text x="8" y="42" font-size="11" fill="#0f172a">PK id_rol: INTEGER</text>
    <text x="8" y="58" font-size="11" fill="#334155">nombre: VARCHAR(40) UQ</text>
    <text x="8" y="74" font-size="11" fill="#334155">descripcion: VARCHAR(150)</text>
  </g>

  <!-- usuario -->
  <g transform="translate(315,65)">
    <rect width="230" height="125" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
    <rect width="230" height="24" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
