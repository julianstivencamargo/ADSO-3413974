    <text x="8" y="58" font-size="11" fill="#1d4ed8">FK id_pedido: INTEGER UQ</text>
    <text x="8" y="74" font-size="11" fill="#1d4ed8">FK id_cajero: INTEGER</text>
    <text x="8" y="90" font-size="11" fill="#334155">numero_factura: VARCHAR(30) UQ</text>
    <text x="8" y="106" font-size="11" fill="#334155">subtotal / impuesto / propina</text>
    <text x="8" y="122" font-size="11" fill="#334155">descuento / total: DECIMAL(10,2)</text>
    <text x="8" y="138" font-size="11" fill="#334155">fecha_emision: DATETIME</text>
  </g>

  <!-- pago -->
