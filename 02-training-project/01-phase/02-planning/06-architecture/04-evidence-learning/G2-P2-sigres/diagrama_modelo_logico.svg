    <rect width="230" height="24" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="115" y="16" font-size="12" font-weight="bold" text-anchor="middle" fill="#5b21b6">factura</text>
